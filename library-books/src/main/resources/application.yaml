spring:
  application:
    name: library-books
  datasource:
    url: jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  shell:
    interactive:
      enabled: true