spring:
  datasource:
    url: jdbc:h2:mem:librarytestdb;DB_CLOSE_DELAY=-1
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
  sql:
    init:
      schema-locations: classpath:schema.sql
      data-locations: classpath:data-test.sql
      mode: embedded
  shell:
    interactive:
      enabled: false
